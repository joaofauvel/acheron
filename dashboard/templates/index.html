<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acheron Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0d1117; color: #c9d1d9; }
    h1 { color: #58a6ff; }
    h2 { color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 600; }
    .badge { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.8rem; font-weight: 500; }
    .badge-running { background: #1f6feb33; color: #58a6ff; }
    .badge-completed { background: #23863633; color: #3fb950; }
    .badge-failed { background: #da363433; color: #f85149; }
    .badge-healthy { background: #23863633; color: #3fb950; }
    .badge-booting { background: #d2992233; color: #d29922; }
    .badge-offline { background: #da363433; color: #f85149; }
    .badge.basis-measured { background: #23863633; color: #3fb950; }
    .badge.basis-cached   { background: #d2992233; color: #d29922; }
    .badge.basis-unknown  { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .badge.basis-static   { background: #1f6feb33; color: #58a6ff; }
    .badge.basis-stub      { background: #8b949e33; color: #8b949e; }
    .cost-unknown { color: #8b949e; }
    .cost-zero    { color: #58a6ff; }
    .basis-note   { color: #8b949e; font-style: italic; font-size: 0.85rem; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .dot-green { background: #3fb950; }
    .dot-yellow { background: #d29922; }
    .dot-red { background: #f85149; }
    .section { margin-bottom: 2rem; }
    .booting-progress { display: grid; gap: 0.25rem; margin-top: 0.35rem; min-width: 10rem; }
    .booting-progress progress { width: 10rem; accent-color: #d29922; }
  </style>
</head>
<body>
  <h1>Acheron <span id="status" hx-get="/partials/status" hx-trigger="load, every 2s" hx-swap="innerHTML" style="font-size:1rem"><span style="color:#8b949e">…</span></span></h1>
  {% if user %}<p style="color:#8b949e">Signed in as {{ user }}</p>{% endif %}

  <div class="section" id="jobs">
    <h2>Jobs</h2>
    <form id="job-filters" hx-get="/partials/jobs" hx-trigger="change" hx-target="#job-results" hx-swap="innerHTML">
      <label>
        Status
        <select name="status">
          <option value="">All</option>
          <option value="running">Stuck</option>
          <option value="failed">Failed</option>
          <option value="completed">Completed</option>
        </select>
      </label>
      <label>
        Older than (seconds)
        <input name="older_than_seconds" type="number" min="0" step="1" placeholder="e.g. 1800">
      </label>
      <label>
        <input name="include_archived" type="checkbox" value="true">
        Include archived
      </label>
    </form>
    <div id="job-results" hx-get="/partials/jobs" hx-trigger="load, every 2s" hx-swap="innerHTML">
      <p style="color:#8b949e">Loading jobs...</p>
    </div>
  </div>

  <div class="section" id="job-detail"></div>

  <div class="section" id="workers">
    <h2>Workers</h2>
    <div hx-get="/partials/workers" hx-trigger="load, every 2s" hx-swap="innerHTML">
      <p style="color:#8b949e">Loading workers...</p>
    </div>
  </div>

  <div class="section" id="cost">
    <h2>Cost</h2>
    <div hx-get="/partials/cost" hx-trigger="load, every 2s" hx-swap="innerHTML">
      <p style="color:#8b949e">Loading cost data...</p>
    </div>
  </div>

  <script>
    function formatBootingElapsed(elapsed, timeout) {
      const safeTimeout = Math.max(0, Math.floor(timeout));
      const safeElapsed = Math.min(safeTimeout, Math.max(0, Math.floor(elapsed)));
      return `${safeElapsed}s / ${safeTimeout}s`;
    }

    function updateBootingProgress() {
      document.querySelectorAll('[data-booting-progress="true"]').forEach((progress) => {
        const timeout = Math.max(0, Math.floor(Number(progress.dataset.timeoutSeconds)));
        const elapsed = Math.min(
          timeout,
          Math.max(0, Math.floor(Number(progress.dataset.elapsedSeconds)) + 1),
        );
        const percentage = timeout === 0 ? 0 : Math.floor((elapsed * 100) / timeout);
        progress.dataset.elapsedSeconds = String(elapsed);
        progress.dataset.percentage = String(percentage);
        const label = progress.querySelector('.booting-elapsed');
        if (label) label.textContent = formatBootingElapsed(elapsed, timeout);
        const bar = progress.querySelector('progress');
        if (bar) bar.value = elapsed;
      });
    }

    setInterval(updateBootingProgress, 1000);
  </script>
</body>
</html>
