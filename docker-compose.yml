      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestrator:
        condition: service_healthy
    profiles: ["runpod-translation"]

  tts-runpod-stub:
    build:
      context: .
      target: worker-stub-base
    ports:
      - "8006:8006"
    environment:
      <<: *stub_env
      WORKER_NAME: tts-runpod-stub
      ACHERON_WORKER__WORKER_ID: tts-runpod-stub
      ACHERON_WORKER__WORKER_HOST: tts-runpod-stub
      ACHERON_WORKER__LISTEN_PORT: "8006"
      ACHERON_WORKER__PRICE_SOURCE: static
      ACHERON_WORKER__DOLLARS_PER_HOUR: "0.69"
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
