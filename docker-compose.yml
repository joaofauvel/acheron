x-build-metadata: &build-metadata
  ACHERON_BUILD_SHA: ${ACHERON_BUILD_SHA:-}
  ACHERON_BUILD_TIME: ${ACHERON_BUILD_TIME:-}
  ACHERON_BUILD_BRANCH: ${ACHERON_BUILD_BRANCH:-}
  ACHERON_BUILD_DIRTY: ${ACHERON_BUILD_DIRTY:-}
  ACHERON_BUILD_IMAGE: ${ACHERON_BUILD_IMAGE:-}
  ACHERON_BUILD_REGISTRY: ${ACHERON_BUILD_REGISTRY:-}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  # One-shot: generates development certs into the shared `certs/` bind mount on
  # first `docker compose up`, so a fresh clone needs no separate `just certs` step.
  # A complete marked bundle is reused on later starts; operator-owned or partial
  # material fails safely before dependent services can start.
  certs-init:
    build:
      context: .
      target: certs-init
    volumes:
      - ./certs:/certs
      - acheron-data:/data
    command:
      - sh
      - -c
      - >-
        python scripts/generate_dev_certs.py --out-dir /certs &&
        chmod 640 /certs/*.key &&
        mkdir -p /data/jobs &&
        chown 1000:0 /data/jobs &&
        chmod 0775 /data/jobs
    restart: "no"

  orchestrator:
    build:
      context: .
      target: orchestrator
      args: *build-metadata
    ports:
      - "8000:8000"
    group_add:
      - "0"
    environment:
      REDIS_URL: redis://redis:6379
      ACHERON_STORE_BACKEND: redis
      ACHERON_REGISTRATION_TOKEN: ${ACHERON_REGISTRATION_TOKEN:-}
      ACHERON_ADMIN_TOKEN: ${ACHERON_ADMIN_TOKEN:-}
      ACHERON_INSECURE_LOCAL_EDGE_HOSTS: tts-local-stub,asr-local-stub,translation-local-stub,tts-runpod-stub,translation-runpod-stub,tts-grpc-stub,qwen3tts-edge,granite-speech-edge,translategemma-edge
      ACHERON_DATA_DIR: /data/jobs
      ACHERON_TLS_CERT_FILE: /certs/orchestrator.crt
      ACHERON_TLS_KEY_FILE: /certs/orchestrator.key
      ACHERON_TLS_CA_FILE: /certs/acheron-ca.crt
      # Only named Compose edges may receive bearer-authenticated HTTP traffic.
      # Other registered plaintext endpoints remain blocked.
      ACHERON_INSECURE_HTTP_WORKER_IDS: ${ACHERON_INSECURE_HTTP_WORKER_IDS:-asr-local-stub,translation-local-stub,translation-runpod-stub,tts-grpc-stub,tts-local-stub,tts-runpod-stub,qwen3tts-1,granite-speech-edge,translategemma-edge}
      SSL_CERT_FILE: /certs/acheron-ca.crt
    volumes:
      - acheron-data:/data
      - ./certs:/certs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import os, ssl, urllib.request; ctx = ssl.create_default_context(cafile=os.environ.get('SSL_CERT_FILE')); urllib.request.urlopen('https://localhost:8000/health', context=ctx).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8080:8080"
    environment:
      ACHERON_URL: https://orchestrator:8000
      ACHERON_BROWSER_URL: https://localhost:8000
      ACHERON_REGISTRATION_TOKEN: ${ACHERON_REGISTRATION_TOKEN:-}
      ACHERON_REGISTRATION_TOKEN_FILE: /data/jobs/.registration_token
      SSL_CERT_FILE: /certs/acheron-ca.crt
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestrator:
        condition: service_healthy

  tts-local-stub:
    build:
      context: .
      target: worker-stub-base
    ports:
      - "8001:8001"
    environment: &stub_env
      WORKER_NAME: tts-local-stub
      ACHERON_WORKER__ORCHESTRATOR_URL: https://orchestrator:8000
      ACHERON_WORKER__WORKER_ID: tts-local-stub
      ACHERON_WORKER__WORKER_HOST: tts-local-stub
      ACHERON_WORKER__REGISTRATION_TOKEN: ${ACHERON_REGISTRATION_TOKEN:-}
      ACHERON_WORKER__REGISTRATION_TOKEN_FILE: /data/jobs/.registration_token
      ACHERON_WORKER__PRICE_SOURCE: zero
      ACHERON_WORKER__LISTEN_PORT: "8001"
      SSL_CERT_FILE: /certs/acheron-ca.crt
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    command: ["python", "-m", "stubs.tts_local_stub.main"]
    healthcheck: &stub_healthcheck
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestrator:
        condition: service_healthy
    profiles: ["sim"]

  asr-local-stub:
    build:
      context: .
      target: worker-stub-base
    ports:
      - "8002:8002"
    environment:
      <<: *stub_env
      WORKER_NAME: asr-local-stub
      ACHERON_WORKER__WORKER_ID: asr-local-stub
      ACHERON_WORKER__WORKER_HOST: asr-local-stub
      ACHERON_WORKER__LISTEN_PORT: "8002"
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    command: ["python", "-m", "stubs.asr_local_stub.main"]
    healthcheck:
      <<: *stub_healthcheck
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"
    depends_on:
      orchestrator:
        condition: service_healthy
    profiles: ["sim"]

  translation-local-stub:
    build:
      context: .
      target: worker-stub-base
    ports:
      - "8003:8003"
    environment:
      <<: *stub_env
      WORKER_NAME: translation-local-stub
      ACHERON_WORKER__WORKER_ID: translation-local-stub
      ACHERON_WORKER__WORKER_HOST: translation-local-stub
      ACHERON_WORKER__LISTEN_PORT: "8003"
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    command: ["python", "-m", "stubs.translation_local_stub.main"]
    healthcheck:
      <<: *stub_healthcheck
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()"
    depends_on:
      orchestrator:
        condition: service_healthy
    profiles: ["sim"]

  qwen3tts-edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
      args: *build-metadata
    expose:
      - "8001"
    environment:
      WORKER_NAME: qwen3tts
      ACHERON_WORKER__ORCHESTRATOR_URL: https://orchestrator:8000
      ACHERON_WORKER__WORKER_ID: ${ACHERON_WORKER__WORKER_ID:-qwen3tts-1}
      ACHERON_WORKER__WORKER_HOST: ${ACHERON_WORKER__WORKER_HOST:-qwen3tts-edge}
      ACHERON_WORKER__REGISTRATION_TOKEN: ${ACHERON_REGISTRATION_TOKEN:-}
      ACHERON_WORKER__REGISTRATION_TOKEN_FILE: /data/jobs/.registration_token
      ACHERON_WORKER__RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      ACHERON_WORKER__RUNPOD_ENDPOINT_ID: ${QWEN3TTS_RUNPOD_ENDPOINT_ID:-}
      ACHERON_WORKER__PRICE_SOURCE: ${ACHERON_WORKER__PRICE_SOURCE:-runpod}
      ACHERON_WORKER__SECURE_CLOUD: ${ACHERON_WORKER__SECURE_CLOUD:-false}
      ACHERON_WORKER__EXECUTION_TIMEOUT_S: ${ACHERON_WORKER__EXECUTION_TIMEOUT_S:-1800}
      ACHERON_WORKER__DEFAULT_SPEAKER: "Ryan"
      ACHERON_WORKER__LISTEN_PORT: "8001"
      SSL_CERT_FILE: /certs/acheron-ca.crt
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestrator:
        condition: service_healthy
    profiles: ["runpod-tts"]

  granite-speech-edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
      args: *build-metadata
    expose:
      - "8001"
    environment:
      WORKER_NAME: granite_speech
      ACHERON_WORKER__ORCHESTRATOR_URL: https://orchestrator:8000
      ACHERON_WORKER__WORKER_ID: ${ACHERON_WORKER__WORKER_ID:-granite-speech-edge}
      ACHERON_WORKER__WORKER_HOST: ${ACHERON_WORKER__WORKER_HOST:-granite-speech-edge}
      ACHERON_WORKER__REGISTRATION_TOKEN: ${ACHERON_REGISTRATION_TOKEN:-}
      ACHERON_WORKER__REGISTRATION_TOKEN_FILE: /data/jobs/.registration_token
      ACHERON_WORKER__RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      ACHERON_WORKER__RUNPOD_ENDPOINT_ID: ${GRANITE_SPEECH_RUNPOD_ENDPOINT_ID:-}
      ACHERON_WORKER__PRICE_SOURCE: ${GRANITE_SPEECH_PRICE_SOURCE:-runpod}
      ACHERON_WORKER__SECURE_CLOUD: "false"
      ACHERON_WORKER__LISTEN_PORT: "8001"
      SSL_CERT_FILE: /certs/acheron-ca.crt
    volumes:
      - acheron-data:/data:ro
      - ./certs:/certs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"
      interval: 30s
