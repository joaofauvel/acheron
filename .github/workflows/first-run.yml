name: First-run journey

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - README.md
      - .env.example
      - Dockerfile
      - docker-compose.yml
      - Justfile
      - dashboard/**
      - scripts/**
      - src/**
      - stubs/**
      - tests/first_run/**
      - .github/workflows/first-run.yml
      - pyproject.toml
      - uv.lock

jobs:
  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: pip install uv
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install project dependencies
        run: uv sync --all-extras --all-packages
      - name: Run first-run journey
        run: just first-run
